{% extends 'base.html' %}{% block content %}
<div class="container mt-3"><div class="row g-3"><div class="col-md-4"><div class="card p-3"><h5>Generate Tax / Bill</h5>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <select class="form-select mb-2" name="user_id" required>{% for u in citizens %}<option value="{{ u.id }}">{{ u.name }} ({{ u.email }})</option>{% endfor %}</select>
 <select class="form-select mb-2" name="bill_type">{% for t in bill_types %}<option>{{ t }}</option>{% endfor %}</select>
 <input class="form-control mb-2" name="property_ref" placeholder="Property / Connection No." required>
 <input class="form-control mb-2" type="number" step="0.01" min="1" name="amount" placeholder="Amount (₹)" required><input class="form-control mb-3" type="date" name="due_date" required>
 <button class="btn btn-primary w-100">Generate</button></form></div></div>
<div class="col-md-8"><h5>All Bills</h5><div class="table-responsive"><table class="table bg-white align-middle">
<tr><th>ID</th><th>Citizen</th><th>Bill</th><th>Ref</th><th>Amount</th><th>Due</th><th>Status</th></tr>
{% for b in rows %}<tr><td>#{{ b.id }}</td><td>{{ b.citizen }}</td><td>{{ b.bill_type }}</td><td>{{ b.property_ref }}</td><td>{{ b.amount|money }}</td><td>{{ b.due_date }}</td><td>{{ b.status|badge }}</td></tr>
{% else %}<tr><td colspan="7" class="text-center">No bills.</td></tr>{% endfor %}</table></div></div></div></div>{% endblock %}

{% extends 'base.html' %}{% block content %}
<div class="container mt-3"><h4>Notices &amp; Announcements</h4>
{% for n in notices %}<div class="card mb-2"><div class="card-body"><h6>📢 {{ n.title }}</h6><p>{{ n.body }}</p><small class="text-muted">{{ n.created_at }}</small>
{% if session.role=='admin' %}<form method="post" action="{{ url_for('delete_notice', nid=n.id) }}" class="d-inline float-end"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form>{% endif %}
</div></div>{% endfor %}</div>{% endblock %}

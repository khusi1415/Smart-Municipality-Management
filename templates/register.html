{% extends 'base.html' %}{% block content %}
<div class="container" style="max-width:480px"><div class="card p-4 mt-3"><h4>Citizen Registration</h4>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <input class="form-control mb-2" name="name" placeholder="Full Name" required>
 <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
 <input class="form-control mb-2" name="phone" placeholder="10-digit Mobile Number" pattern="\d{10}" required>
 <input class="form-control mb-2" name="address" placeholder="Address / Ward">
 <input class="form-control mb-3" type="password" name="password" placeholder="Password (min 6)" minlength="6" required>
 <button class="btn btn-primary w-100">Register</button></form></div></div>{% endblock %}
